<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | WILLDWAVE RAFTING LTD. </title>
    <meta name="description"
      content="Contact us to ask questions, make a reservation, or share suggestions. Find our address, phone, email, and map.">
    <meta name="author" content="Teye Collins">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting_logo.jpg" alt="Logo of White Water Rafting">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <h1>WILDWAVE RAFTING LTD.</h1>
            <h3>123 Main River Street</h3>
            <h3>Chicago, USA</h3>
            <h3>+1 765 654 8765</h3>
            <h3>info@wildwaveltd.com</h3>
        </div>
        <div class="contact-grid">
            <div>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d380511.8252335547!2d-87.73187899999999!3d41.83371054999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x880e2c3cd0f4cbed%3A0xafe0a6ad09c0c000!2sChicago%2C%20IL%2C%20USA!5e0!3m2!1sen!2sgh!4v1790992327789!5m2!1sen!2sgh"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <div>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Name" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Email" required>
                </div>
                <fieldset>
                    <legend>Message Purpose</legend>
                    <div>
                        <input type="radio" name="purpose" id="general" value="general" required>
                        <label for="general">General Inquiry</label>
                    </div>
                    <div>
                        <input type="radio" name="purpose" id="reservation" value="reservation"
                          required>
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div>
                        <input type="radio" name="purpose" id="suggestion" value="suggestion"
                          required>
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </fieldset>
                <div>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4" placeholder="Type Here"
                      required></textarea>
                </div>
                <div class="checkbox">
                    <input type="checkbox" name="subscribe" id="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch! </button>
            </form>
        </div>
        <section class="team">
            <h2>We Are Here to Serve You </h2>
            <div class="team-images">
                <figure>
                    <img src="images/employee1.jpg" alt="Profile of Scarlet Johannsen">
                    <figcaption>Scarlet Johannsen - Receptionist</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Profile of Lee Hwang-Son">
                    <figcaption>Lee Hwang-Son - Managing Director</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Profile of Jean Grey">
                    <figcaption>Jean Grey - Secretary</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>
            &copy;2026 🚣‍♂️ WILLDWAVE RAFTING LTD. 🚣‍♂️ | TEYE COLLINS
        </p>
        <nav class="socialmedia">
            <a href="https://tiktok.com">
                <img src="images/tiktok-icon.svg" alt="TikTok Icon">
            </a>
            <a href="https://wa.me/">
                <img src="images/whatsapp-icon.svg" alt="WhatsApp Icon"></a>
            <a href="https://instagram.com">
                <img src="images/instagram-icon.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
